<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="title">
  <title id="title">Unix cron and Quartz cron convert into each other in both directions; either format can also be validated, described in plain English, and turned into next or previous run times.</title>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,4.5 L1,8 Z" fill="#57606a"/>
    </marker>
    <marker id="arrLight" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,4.5 L1,8 Z" fill="#8c959f"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <!-- card background -->
  <rect x="6" y="6" width="848" height="388" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Unix cron box -->
  <rect x="70" y="64" width="270" height="112" rx="14" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text class="sans" x="205" y="100" text-anchor="middle" font-size="19" font-weight="bold" fill="#0969da">Unix cron</text>
  <text class="mono" x="205" y="130" text-anchor="middle" font-size="16" fill="#1f2328">*/15 * * * *</text>
  <text class="sans" x="205" y="156" text-anchor="middle" font-size="12" fill="#57606a">5 fields · DOW 0–7 (0 = SUN)</text>

  <!-- Quartz cron box -->
  <rect x="520" y="64" width="270" height="112" rx="14" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text class="sans" x="655" y="100" text-anchor="middle" font-size="19" font-weight="bold" fill="#9a6700">Quartz cron</text>
  <text class="mono" x="655" y="130" text-anchor="middle" font-size="15" fill="#1f2328">0 */15 * * * ? *</text>
  <text class="sans" x="655" y="156" text-anchor="middle" font-size="12" fill="#57606a">6–7 fields · DOW 1–7 (1 = SUN)</text>

  <!-- conversion arrows -->
  <text class="mono" x="426" y="88" text-anchor="middle" font-size="13" fill="#57606a">unixToQuartz</text>
  <line x1="348" y1="100" x2="504" y2="100" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="512" y1="140" x2="356" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <text class="mono" x="434" y="162" text-anchor="middle" font-size="13" fill="#57606a">quartzToUnix</text>

  <!-- dashed connectors down to the capability bar -->
  <path d="M205 176 L300 250" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrLight)"/>
  <path d="M655 176 L560 250" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrLight)"/>

  <!-- capability bar -->
  <rect x="170" y="256" width="520" height="88" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="sans" x="430" y="284" text-anchor="middle" font-size="13" fill="#57606a">then, from either format, one call also gives you:</text>

  <rect x="190" y="296" width="122" height="34" rx="17" fill="#dafbe1" stroke="#2da44e"/>
  <text class="sans" x="251" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">validate</text>

  <rect x="328" y="296" width="192" height="34" rx="17" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="sans" x="424" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#0969da">describe in English</text>

  <rect x="536" y="296" width="134" height="34" rx="17" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="sans" x="603" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6700">next run times</text>
</svg>
